[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multisensory-dynamics-lab"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ["numpy==1.23.5", "brian2==2.6.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
mdl-run = "mdl.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
