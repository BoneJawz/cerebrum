[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "multisensory-dynamics-lab"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy==1.23.5", "brian2==2.6.0", "matplotlib==3.9.0"]
[project.optional-dependencies]
dev = ["pytest==9.1.1"]
[project.scripts]
mdl-association = "mdl.cli:main"
mdl-live = "mdl.live_dashboard:main"
mdl-continuous-learning = "mdl.continuous_learning_cli:main"
mdl-visual-sensory = "mdl.visual_sensory_cli:main"
mdl-distributed-visual = "mdl.distributed_visual_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
