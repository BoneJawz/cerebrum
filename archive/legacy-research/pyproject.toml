[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "multisensory-dynamics-lab"
version = "0.3.0"
description = "CPU-first modular 1D vision and raw audio research benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
nengo = ["nengo==4.0.0", "matplotlib>=3.7"]
[project.scripts]
sensory-lab = "sensory_lab.cli:main"
sensory-lab-viewer = "sensory_lab.viewer:main"
sensory-lab-research = "sensory_lab.advanced_cli:main"
sensory-lab-diagnose = "sensory_lab.diagnostic_cli:main"
sensory-lab-adaptive = "sensory_lab.adaptive_cli:main"
sensory-lab-factor = "sensory_lab.factor_cli:main"
sensory-lab-controlled-factor = "sensory_lab.controlled_factor:main"
sensory-lab-liquid = "sensory_lab.liquid_experiment:main"
sensory-lab-spatial = "sensory_lab.spatial_grounding:main"
sensory-lab-spatial-viewer = "sensory_lab.spatial_viewer:main"
sensory-lab-spatial-range = "sensory_lab.spatial_range_benchmark:main"
sensory-lab-experiential-tokens = "sensory_lab.experiential_tokens:main"
sensory-lab-temporal = "sensory_lab.temporal_diagnostics:main"
sensory-lab-recognition = "sensory_lab.recognition_experiment:main"
sensory-lab-nengo = "sensory_lab.nengo_associative_baseline:main"
[tool.setuptools.packages.find]
where = ["src"]
